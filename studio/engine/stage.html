<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مسرح الرسم</title>
<link rel="stylesheet" href="/engine/base.css">
<style>html, body { margin: 0; background: transparent; } #stage { width: max-content; }</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import * as S from '/engine/stage.js';
  window.STAGE = S;
  window.__stageReady = true;
  // المعاينة جوه اللوحة: اللوحة بتبعت أمر التصميم برسالة
  window.addEventListener('message', async e => {
    if (e.data && e.data.kind === 'play') { for (const a of document.querySelector('.cv')?.getAnimations({ subtree: true }) || []) { a.currentTime = 0; a.play(); } return; }
    if (!e.data || e.data.kind !== 'job') return;
    try {
      const r = await S.mount(e.data.job, { mode: e.data.mode || 'static' });
      parent.postMessage({ kind: 'mounted', ...r, seq: e.data.seq }, '*');
    } catch (err) { parent.postMessage({ kind: 'error', message: String(err.message || err), seq: e.data.seq }, '*'); }
  });
  parent.postMessage({ kind: 'stage-ready' }, '*');
</script>
</body>
</html>
