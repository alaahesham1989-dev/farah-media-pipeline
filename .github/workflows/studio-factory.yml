name: استوديو فرح — مكنة الريلز

# ريل (≈17 ث طولي، مزيكا وكلام كبير من غير صوت) لكل منتج منشور، ومتخزن على R2 — اللوحة بتعرضه في «🎬 فيديوهات المنتجات» وطابور النشر.
# + محتوى النشر المجدول (promo/index.json): صورة إعلان 4:5 لكل منتج بسعره الحالي، وريل وصورة لكل منتج في عرض شغّال/قريب، ولكل كوبون دعائي.
# بيلف لوحده كل ساعة: أول خطوة (plan) بتشوف فيه حاجة اتغيرت ولا لأ (سعر/عرض/كوبون/كلام/صور) — لو مفيش، الأجهزة والفهرس مابيقوموش أصلاً.
# تشغيل يدوي بتعديل triggers/factory.txt — سطور زي:  only=code0013,code0028   أو   force=yes (29/9: إعادة تسجيل الميعاد)
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths: ['triggers/factory.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency: studio-factory

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  MEDIA_BUCKET: farah-media

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      render: ${{ steps.plan.outputs.render }}
      index: ${{ steps.plan.outputs.index }}
      args: ${{ steps.args.outputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: أوامر التشغيل اليدوي
        id: args
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f triggers/factory.txt ]; then
            ONLY=$(grep -oP '^only=\K.*' triggers/factory.txt | tr -cd 'A-Za-z0-9_,:-' || true)
            FORCE=$(grep -oP '^force=\K.*' triggers/factory.txt | tr -d ' \r' || true)
            [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
            [ "$FORCE" = "yes" ] && ARGS="$ARGS --force"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: فيه شغل؟
        id: plan
        working-directory: studio
        env:
          EXTRA: ${{ steps.args.outputs.args }}
        run: node tools/factory.mjs --plan $EXTRA

  render:
    needs: plan
    if: needs.plan.outputs.render == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: studio
      - name: فك المزيكا المرخصة (متشفرة في المشروع)
        run: node studio/tools/assets-crypt.mjs open
      - name: الريلز وصور ومقاطع العروض والكوبونات
        working-directory: studio
        env:
          EXTRA: ${{ needs.plan.outputs.args }}
        run: |
          ARGS="--shard ${{ matrix.shard }}/4 --upload $EXTRA"
          echo "▶ $ARGS"
          node tools/factory.mjs $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-${{ matrix.shard }}
          path: |
            studio/out/factory/results-*.json
            studio/out/factory/promo-*.json
          retention-days: 3
          if-no-files-found: ignore

  index:
    needs: [plan, render]
    if: always() && needs.plan.outputs.index == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: needs.render.result != 'skipped'
        with:
          pattern: factory-*
          merge-multiple: true
          path: results
      - name: الفهرسين (الريلز + النشر)
        run: |
          mkdir -p results
          cd studio && node tools/factory.mjs --merge ../results --upload
