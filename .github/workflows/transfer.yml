name: نقل الميديا للمخزن الخام

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: 'أنواع الملفات (image,video)'
        default: 'image,video'
      only_real:
        description: 'صور وفيديو "ع الطبيعة" بس؟ (1 = آه)'
        default: '0'
      max_mb:
        description: 'تخطي الملفات الأكبر من (ميجا)'
        default: '300'
      products:
        description: 'منتجات معينة (أرقام صفقة بفاصلة) — فاضي = الكل'
        default: ''

concurrency: transfer

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: نقل
        run: node scripts/transfer.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KINDS: ${{ inputs.kinds }}
          ONLY_REAL: ${{ inputs.only_real }}
          MAX_MB: ${{ inputs.max_mb }}
          PRODUCTS: ${{ inputs.products }}
          TIME_BUDGET_MIN: '300'
