name: نقل صور تاجر لمخزن الموقع

# بيشتغل لما ملف triggers/taager-media.txt يتغير (أو يدوي)، وبيكمّل نفسه لو الوقت خلص
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['triggers/taager-media.txt']

concurrency: taager-media

permissions:
  contents: read
  actions: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg + OCR عربي
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-ara >/dev/null && tesseract --list-langs | tail -3
      - run: npm ci
      - name: نقل
        run: node scripts/taager-media.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BUCKET: farah-media
          MAX_TOTAL_GB: '5'
          TIME_BUDGET_MIN: '320'
      - name: يكمّل لوحده لو الوقت خلص
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat previews/continue.txt 2>/dev/null)" = "yes" ]; then gh workflow run taager-media.yml --ref main; echo "▶️ التشغيلة الجاية اتبدأت"; else echo "خلصنا"; fi
