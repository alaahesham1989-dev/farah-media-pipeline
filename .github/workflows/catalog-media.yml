name: نقل ميديا المكتبة لمخزن الموقع

# بيشتغل: يدوي · كل يوم الساعة 6 الصبح بتوقيت مصر (بعد ما حد درايف اليومي يفتح) بيعيد اللي فشل · أو لما triggers/catalog-media.txt يتغير
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths: ['triggers/catalog-media.txt']
  workflow_dispatch:
    inputs:
      codes:
        description: 'أكواد معينة (code0100,code0101) — فاضي = الكل'
        default: ''
      max_total_gb:
        description: 'أقصى إجمالي بالجيجا'
        default: '5'

concurrency: catalog-media

permissions:
  contents: write
  actions: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - run: npm ci
      - name: نقل
        run: node scripts/media-move.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BUCKET: farah-media
          CODES: ${{ inputs.codes }}
          MAX_TOTAL_GB: ${{ inputs.max_total_gb }}
          TIME_BUDGET_MIN: '320'
      - name: حفظ الخريطة في فرع media-map
        if: always()
        run: |
          [ -f previews/media-map.json ] || exit 0
          git config user.name "farah-media-bot"
          git config user.email "farah-media-bot@users.noreply.github.com"
          cp previews/media-map.json /tmp/media-map.json
          cp previews/continue.txt /tmp/continue.txt 2>/dev/null || true
          git fetch origin media-map || true
          git checkout -B media-map
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp /tmp/media-map.json media-map.json
          git add -f media-map.json
          git commit -m "media map" || echo "nothing to commit"
          git push -f origin media-map
      - name: يكمّل لوحده لو فاضل منتجات
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat /tmp/continue.txt 2>/dev/null)" = "yes" ]; then
            gh workflow run catalog-media.yml --ref main -f max_total_gb='${{ inputs.max_total_gb }}'
            echo "▶️ التشغيلة الجاية اتبدأت"
          else
            echo "خلصنا (أو مش محتاج يكمّل)"
          fi
