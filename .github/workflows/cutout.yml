name: قص خلفية المنتجات (للمشاهد)

# بيقص خلفية صورة كل منتج منشور (rembg + BiRefNet، رخصة MIT) ويحطها في R2 farah-media تحت cutouts/
# مع لوحة مراجعة cutouts/sheet.jpg. مابينشرش حاجة — Claude بيراجع بالعين الأول. القواعد في scripts/cutout.py.
# التشغيل: triggers/cutout.txt (codes=all أو أكواد بفاصلة، و limit=N اختياري).
on:
  push:
    branches: [main]
    paths: ['triggers/cutout.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency: cutout

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      MEDIA_BUCKET: farah-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-birefnet-general-lite-v1
      - run: pip install "rembg[cpu]" pillow requests boto3
      - name: قص
        run: python scripts/cutout.py
