name: فيديو إعلان تجريبي

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'ملف الإعلان (ads/….json)'
        default: 'ads/steam-cleaner.json'

permissions:
  contents: write

jobs:
  ad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg + خط عربي
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          ffmpeg -hide_banner -filters | grep drawtext
          fc-list :lang=ar file | head
      - run: npm ci
      - name: عمل الفيديو
        run: node scripts/make-ad.mjs "${{ inputs.config }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ad-preview
          path: previews/
      - name: حفظ المعاينة في فرع previews
        run: |
          git config user.name "farah-media-bot"
          git config user.email "farah-media-bot@users.noreply.github.com"
          git fetch origin previews || true
          git checkout -B previews
          git add -f previews/
          git commit -m "ad preview: ${{ inputs.config }}" || echo "nothing to commit"
          git push -f origin previews
