name: قراية الكلام اللي على صور المنتجات

# بيشتغل لما triggers/ocr-products.txt يتغير (أو يدوي)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['triggers/ocr-products.txt']

concurrency: ocr-products

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg + OCR عربي
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-ara >/dev/null
      - run: npm ci
      - name: قراية
        run: node scripts/ocr-products.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BUCKET: farah-media
